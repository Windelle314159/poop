<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>便笺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --text:#2b241c; --sub:#8a7f6e;
  --accent:#c8873a; --accent2:#7a9a6b; --line:#e8e1d3; --danger:#c25b4a; --gold:#d9a53b; --gold2:#b8791f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1a1815;--card:#26221c;--text:#eee6d8;--sub:#9c9285;--accent:#e0a860;--accent2:#8fb97e;--line:#38332b;--danger:#e0796a;--gold:#e8b955;--gold2:#c9922f;}
}
:root[data-theme="dark"]{--bg:#1a1815;--card:#26221c;--text:#eee6d8;--sub:#9c9285;--accent:#e0a860;--accent2:#8fb97e;--line:#38332b;--danger:#e0796a;--gold:#e8b955;--gold2:#c9922f;}
html{height:100%;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100%;-webkit-tap-highlight-color:transparent;}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px));}
.header{text-align:center;margin-bottom:12px;}
h1{font-family:'Noto Serif SC',serif;font-size:22px;margin:6px 0 2px;letter-spacing:1px;font-weight:700;}
.tag{color:var(--sub);font-size:12px;}
.hr-deco{width:40px;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:3px;margin:9px auto 0;}
.hint{font-size:11px;color:var(--sub);text-align:center;margin:0 0 12px;line-height:1.5;font-style:italic;}
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;display:flex;gap:5px;background:var(--card);border:1px solid var(--line);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.08);}
.tab-btn{flex:1;padding:8px 2px;border:none;background:transparent;border-radius:10px;font-size:12.5px;color:var(--sub);cursor:pointer;font-weight:600;transition:all .15s;}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(200,135,58,.35);}
.page{display:none;} .page.active{display:block;animation:fadein .2s;}
@keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.card h2{font-family:'Noto Serif SC',serif;font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:700;letter-spacing:.3px;}
.opts{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
.opt{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:7px 9px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px;line-height:1.25;user-select:none;transition:all .12s;touch-action:manipulation;}
.opt.big{flex-direction:column;min-width:62px;text-align:center;padding:9px 5px;}
.opt.big .ic{font-size:20px;}
.opt.sel{border-color:var(--accent);background:var(--accent);color:#fff;}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15);pointer-events:none;}
.timeRow{width:100%;display:flex;gap:8px;}
.timeRow input{flex:1 1 0;min-width:0;width:0;max-width:100%;box-sizing:border-box;padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font-size:12.5px;}
.submit{width:100%;padding:14px;border:none;border-radius:14px;background:var(--accent2);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:2px;box-shadow:0 3px 10px rgba(122,154,107,.35);position:relative;z-index:1;touch-action:manipulation;}
.submit:active{opacity:.85;transform:scale(.99);}
.nameRow{display:flex;gap:8px;}
.nameRow input{flex:1;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;}
.lvcard{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(200,146,50,.3);}
.lvtop{display:flex;justify-content:space-between;align-items:baseline;}
.lvname{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;}
.lvnum{font-size:12px;opacity:.9;}
.xpbar{height:12px;background:rgba(255,255,255,.35);border-radius:7px;overflow:hidden;margin-top:8px;}
.xpfill{height:100%;background:#fff;border-radius:7px;transition:width .4s;}
.xptext{font-size:11px;margin-top:4px;opacity:.9;text-align:right;}
.stat-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.stat-box{flex:1 1 70px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.stat-box .num{font-size:18px;font-weight:800;color:var(--accent);}
.stat-box .lbl{font-size:10px;color:var(--sub);margin-top:2px;}
.analysis{font-size:13.5px;line-height:1.75;}
.analysis b{color:var(--accent);}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.donut{width:110px;height:110px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 8px var(--card);}
.legend{flex:1;min-width:140px;font-size:12px;}
.legend-row{display:flex;align-items:center;gap:6px;margin:4px 0;}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.moodPills{display:flex;flex-wrap:wrap;gap:8px;}
.moodPill{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:20px;border:1px solid var(--line);font-size:12px;}
.moodPill .n{font-weight:700;color:var(--accent);}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.cal-head button{border:none;background:var(--bg);color:var(--text);border-radius:8px;padding:5px 10px;font-size:14px;cursor:pointer;}
.cal-title{font-weight:700;font-size:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-grid .wd{font-size:10px;color:var(--sub);padding-bottom:2px;}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--bg);color:var(--sub);position:relative;cursor:pointer;}
.cal-day.has1{background:#e0b25a55;color:var(--text);}
.cal-day.has2{background:#d99a3fa0;color:#fff;}
.cal-day.has3{background:var(--accent);color:#fff;font-weight:700;}
.cal-day.today{outline:2px solid var(--accent2);}
.cal-day .mstar{position:absolute;top:-3px;right:-3px;font-size:10px;filter:drop-shadow(0 0 2px rgba(0,0,0,.4));}
.wallgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.wallcard{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--bg);border:1px solid var(--line);font-size:10.5px;padding:4px;}
.wallcard .wic{font-size:20px;display:block;margin-bottom:3px;}
.wallcard.locked{color:var(--sub);font-size:20px;}
.wallcard.mile{background:linear-gradient(160deg,var(--gold),var(--gold2));color:#fff;border:1.5px solid #fff3;box-shadow:0 3px 10px rgba(200,146,50,.4);}
.wallcard.mile .wic{filter:drop-shadow(0 0 3px rgba(255,255,255,.6));}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;margin:3px 4px 0 0;}
details.histbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
details.histbox summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--sub);list-style:none;}
details.histbox summary::-webkit-details-marker{display:none;}
details.histbox summary:before{content:'▸ ';color:var(--accent);}
details.histbox[open] summary:before{content:'▾ ';}
.entry{border-bottom:1px solid var(--line);padding:10px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.entry:last-child{border-bottom:none;}
.entry .meta{color:var(--sub);font-size:11px;margin-top:2px;}
.del{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px;}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:20px 0;}
.tonebtns{display:flex;gap:7px;}
.tonebtns .opt{flex:1;justify-content:center;}
.dmrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.dmbtn{flex:1;min-width:100px;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font-size:12.5px;cursor:pointer;text-align:center;}
.dmbtn.danger{color:var(--danger);background:var(--bg);border-color:var(--danger);opacity:.8;}
textarea#importArea{width:100%;min-height:64px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);padding:8px;font-size:12px;margin-bottom:8px;font-family:inherit;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;padding:20px;}
.overlay.show{opacity:1;pointer-events:auto;}
.modal-box{background:var(--card);border-radius:18px;padding:20px;max-width:340px;width:100%;max-height:70vh;overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.35);transform:translateY(-10%);}
.modal-box.special{border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(217,165,59,.22),0 14px 40px rgba(0,0,0,.35);}
.modal-box .ttl{font-family:'Noto Serif SC',serif;font-weight:700;color:var(--gold2);margin-bottom:8px;font-size:16px;}
.modal-box .msg{font-size:13.5px;line-height:1.7;}
.modal-close{display:block;margin:14px auto 0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 18px;font-size:13px;color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>便笺</h1>
    <div class="tag">记录每一次点滴，从容自在</div>
    <div class="hr-deco"></div>
  </div>

  <div class="page active" id="page-record">
    <div class="hint">只记录形状也可以，其余都是选填～</div>
    <div class="card"><h2>形状（布里斯托分类）</h2><div class="opts" id="opt-type"></div></div>
    <div class="card"><h2>颜色</h2><div class="opts" id="opt-color"></div></div>
    <div class="card"><h2>分量</h2><div class="opts" id="opt-size"></div></div>
    <div class="card"><h2>气味</h2><div class="opts" id="opt-smell"></div></div>
    <div class="card"><h2>当时状态</h2><div class="opts" id="opt-mood"></div></div>
    <div class="card"><h2>用时</h2><div class="opts" id="opt-duration"></div></div>
    <div class="card"><h2>地点</h2><div class="opts" id="opt-place"></div></div>
    <div class="card"><h2>发生时间</h2><div class="timeRow"><input id="dateInput" type="date"><input id="timeOnlyInput" type="time"></div></div>
    <button class="submit" id="btnSave">完成打卡</button>
  </div>

  <div class="page" id="page-stats">
    <div class="card"><h2>便便情报</h2><div class="analysis" id="analysisBox">暂无数据，快去记录吧～</div></div>
    <div class="card"><h2>形状占比</h2><div class="donut-wrap"><div class="donut" id="typeDonut"></div><div class="legend" id="typeLegend"></div></div></div>
    <div class="card"><h2>如厕时段分布</h2><div class="donut-wrap"><div class="donut" id="timeDonut"></div><div class="legend" id="timeLegend"></div></div><div class="analysis" id="timeSummary" style="margin-top:8px"></div></div>
    <div class="card"><h2>状态占比</h2><div class="moodPills" id="moodChips"></div></div>
  </div>

  <div class="page" id="page-achieve">
    <div class="lvcard">
      <div class="lvtop"><div class="lvname" id="lvName">Lv.1 新手上路</div><div class="lvnum" id="lvXP">0 XP</div></div>
      <div class="xpbar"><div class="xpfill" id="xpFill" style="width:0%"></div></div>
      <div class="xptext" id="xpNext">还需 60 XP 升级</div>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="num" id="statWeek">0</div><div class="lbl">本周次数</div></div>
      <div class="stat-box"><div class="num" id="statStreak">0</div><div class="lbl">当前连续</div></div>
      <div class="stat-box"><div class="num" id="statLongest">0</div><div class="lbl">最长连续</div></div>
      <div class="stat-box"><div class="num" id="statTotal">0</div><div class="lbl">累计次数</div></div>
    </div>
    <div class="card">
      <div class="cal-head"><button id="calPrev">‹</button><div class="cal-title" id="calTitle"></div><button id="calNext">›</button></div>
      <div class="cal-grid" id="calGrid"></div>
      <div style="font-size:10.5px;color:var(--sub);margin-top:6px">✦ 标记为达成里程碑的日子，点开日期可查看当天详情</div>
    </div>
    <div class="card"><h2>成就</h2><div id="badges"></div></div>
  </div>

  <div class="page" id="page-mine">
    <div class="card"><h2>你的称呼</h2><div class="nameRow"><input id="nameInput" type="text" maxlength="8" placeholder="给自己起个昵称吧"></div></div>
    <div class="card"><h2>打卡语气</h2><div class="tonebtns" id="toneBtns">
      <div class="opt" data-tone="mild">温和</div><div class="opt" data-tone="normal">日常</div><div class="opt" data-tone="hype">浮夸</div>
    </div></div>
    <div class="card"><h2>里程碑</h2><div class="wallgrid" id="mileWall"></div><div style="font-size:10.5px;color:var(--sub);margin-top:8px">未解锁的里程碑保持神秘，达成后才会揭晓～</div></div>
    <div class="card"><details class="histbox"><summary>历史打卡记录</summary><div id="historyList" style="margin-top:8px"><div class="empty">还没有记录</div></div></details></div>
    <div class="card"><h2>数据管理</h2>
      <div class="dmrow"><button class="dmbtn" id="btnExport">导出</button><button class="dmbtn" id="btnImport">导入</button><button class="dmbtn danger" id="btnReset">清空数据</button></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-p="record">打卡</button>
    <button class="tab-btn" data-p="stats">统计</button>
    <button class="tab-btn" data-p="achieve">成就</button>
    <button class="tab-btn" data-p="mine">我的</button>
  </div>
</div>

<div class="overlay" id="dataOv"><div class="modal-box"><div class="ttl" id="dataTtl">数据</div><div class="msg" id="dataMsg"></div><button class="modal-close" id="dataClose">关闭</button></div></div>
<div class="overlay" id="toastOv"><div class="modal-box" id="toastBox"><div class="ttl" id="toastTtl"></div><div class="msg" id="toastMsg"></div></div></div>
<div class="overlay" id="dayOv"><div class="modal-box"><div class="ttl" id="dayTtl"></div><div class="msg" id="dayMsg"></div><button class="modal-close" id="dayClose">关闭</button></div></div>

<script>
const TYPES=[
 {id:1,ic:'🐑',name:'羊球状',desc:'硬块,便秘',color:'#9c6b3f'},
 {id:2,ic:'🌰',name:'香肠块状',desc:'偏硬',color:'#b07d3f'},
 {id:3,ic:'🌭',name:'带裂纹',desc:'正常',color:'#c8873a'},
 {id:4,ic:'🍌',name:'光滑香肠',desc:'完美',color:'#d9b23c'},
 {id:5,ic:'🟤',name:'软块状',desc:'偏软',color:'#a68a5a'},
 {id:6,ic:'💧',name:'糊状',desc:'较稀',color:'#7a9a6b'},
 {id:7,ic:'🌊',name:'水状',desc:'腹泻',color:'#5a8ab0'},
];
const COLORS=[
 {id:'棕色',dot:'#7a5230'},{id:'黄色',dot:'#d9b23c'},{id:'深褐',dot:'#4a3220'},
 {id:'绿色',dot:'#6a8a4a'},{id:'黑色',dot:'#2a2420'},{id:'偏红',dot:'#b0473b'},
 {id:'橙色',dot:'#d9793c'},{id:'灰白',dot:'#b8b0a2'},
];
const SIZES=[{id:'迷你',ic:'🫘'},{id:'小',ic:'🥚'},{id:'中',ic:'🍆'},{id:'大',ic:'🎃'},{id:'超大',ic:'🦕'}];

const MOODS=[
 {id:'轻松愉悦',ic:'😌'},{id:'畅快淋漓',ic:'🤩'},{id:'平平无奇',ic:'😐'},
 {id:'有点费力',ic:'😣'},{id:'非常痛苦',ic:'😖'},{id:'意犹未尽',ic:'🤔'},
 {id:'如释重负',ic:'🫠'},{id:'灵魂出窍',ic:'😵'},{id:'恍如新生',ic:'🌅'},
];
const DURATIONS=[
 {id:'<1分钟',ic:'⚡'},{id:'1-3分钟',ic:'🙂'},{id:'3-8分钟',ic:'📱'},
 {id:'8-15分钟',ic:'📖'},{id:'15-30分钟',ic:'🎧'},{id:'30分钟-1小时',ic:'🎮'},{id:'1小时以上',ic:'🛋️'},

const MILESTONES=[

 {n:666,title:'六六六',ic:'🎮',desc:'操作666,行云流水。'},
 {n:777,title:'幸运七',ic:'🍀',desc:'777,好运连连。'},
 {n:888,title:'发发发++',ic:'🎆',desc:'发发发再发。'},
 {n:999,title:'天长地久',ic:'⏳',desc:'长长久久的坚持。'},
 {n:1000,title:'千次传说',ic:'🏆',desc:'千锤百炼的坚持。'},
 {n:1119,title:'世界厕所日',ic:'🚽',desc:'11月19日,属于每一次蹲点的日子。'},
 {n:1314,title:'一生一世',ic:'💍',desc:'1314,一生一世的坚持。'},
 {n:2333,title:'笑到崩溃',ic:'🤣',desc:'2333,你也太拼了。'},
 {n:3141,title:'圆周率',ic:'🥧',desc:'数学之美,3.141...'},
 {n:6666,title:'六六六六',ic:'🐉',desc:'顺到飞起。'},
 {n:8888,title:'发发发发',ic:'🎇',desc:'四发连击,财源滚滚。'},
 {n:10000,title:'万次传说',ic:'👑',desc:'一万次,当之无愧的传说。'},
];
const BADGE_DEFS=[

function buildOpts(containerId,list,key,big){
  const c=document.getElementById(containerId); c.innerHTML='';
  list.forEach(item=>{
    const btn=document.createElement('div');
    btn.className='opt'+(big?' big':'');
    let inner='';
    if(item.dot) inner+=`<span class="dot" style="background:${item.dot}"></span>`;
    if(item.ic) inner+=big?`<span class="ic">${item.ic}</span>`:`<span>${item.ic}</span>`;
    inner+=`<span>${item.name||item.id}${item.desc?`<br><small style="opacity:.75">${item.desc}</small>`:''}</span>`;
    btn.innerHTML=inner;
    btn.onclick=()=>{ c.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); btn.classList.add('sel'); sel[key]=item.id; };
    c.appendChild(btn);
  });
}

function toneAdjust(msg){
  const t=getTone();
  if(t==='mild') return msg.replace(/！/g,'。').replace(/[🔥💪🏅🛡️✨🤩🎉]/g,'').trim();
  if(t==='hype') return (msg.replace(/。$/,'！')) + (Math.random()<0.6?' 🔥':'');
  return msg;
}

const LEVELS=[
 {lv:1,name:'新手上路',need:0},{lv:2,name:'渐入佳境',need:60},{lv:3,name:'游刃有余',need:150},
 {lv:4,name:'炉火纯青',need:280},{lv:5,name:'登峰造极',need:450},{lv:6,name:'出神入化',need:680},
 {lv:7,name:'返璞归真',need:960},{lv:8,name:'天人合一',need:1300},
];
function levelInfo(totalXP){
  let cur=LEVELS[0], next=LEVELS[1];
  for(let i=0;i<LEVELS.length;i++){ if(totalXP>=LEVELS[i].need){ cur=LEVELS[i]; next=LEVELS[i+1]||null; } }
  if(!next){
    const extra=Math.floor((totalXP-cur.need)/500)+1;
    const base=LEVELS[LEVELS.length-1];
    cur={lv:base.lv+extra-1,name:base.name,need:base.need+(extra-1)*500};
    next={need:cur.need+500};
  }
  const pct=Math.min(100,Math.round((totalXP-cur.need)/(next.need-cur.need)*100));
  return {cur,next,pct};
}

const TYPE_MSGS_GOOD=['形态满分，教科书级别，经验+5！','完美，堪称典范，经验+5。'];
const TYPE_MSGS_OK=['每一次都值得被记录，经验+3。','状态不一，慢慢来，经验+3。'];
function computeBaseXP(entry,streak){
  let xp=10, msgs=[toneAdjust(pick(BASE_MSGS))];
  if(entry.duration){ const p=DUR_MSGS[entry.duration]; if(p){ msgs.push(toneAdjust(pick(p))); xp+=DUR_XP[entry.duration]||3; } }
  if(entry.mood){ const p=MOOD_MSGS[entry.mood]; if(p){ msgs.push(toneAdjust(pick(p))); xp+=MOOD_XP[entry.mood]||2; } }
  if(entry.type===3||entry.type===4){ msgs.push(toneAdjust(pick(TYPE_MSGS_GOOD))); xp+=5; } else { msgs.push(toneAdjust(pick(TYPE_MSGS_OK))); xp+=3; }
  if(streak>=2){ const bonus=Math.min(streak*2,20); xp+=bonus; msgs.push(toneAdjust(`连续打卡 ${streak} 天，连击经验+${bonus}。`)); }
  return {xp,msgs};
}

function currentStreak(list,fromTime){
  const daysSet=new Set(list.map(e=>new Date(e.time).toDateString()));
  let streak=0, cursor=new Date(fromTime||Date.now());
  while(daysSet.has(cursor.toDateString())){ streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}
function longestStreak(list){
  const days=[...new Set(list.map(e=>new Date(e.time).toDateString()))].map(d=>new Date(d).getTime()).sort((a,b)=>a-b);
  let max=0,cur=0,prev=null;
  days.forEach(d=>{ if(prev!==null && d-prev===86400000){ cur+=1; } else { cur=1; } max=Math.max(max,cur); prev=d; });
  return max;
}

document.getElementById('btnSave').onclick=()=>{
  if(!sel.type){ alert('至少选一下形状吧'); return; }
  const list=loadData();
  const dVal=document.getElementById('dateInput').value;
  const tVal=document.getElementById('timeOnlyInput').value;
  const time=(dVal&&tVal)? new Date(`${dVal}T${tVal}`).getTime() : Date.now();
  const prevStreak=currentStreak(list);
  const prevLongest=longestStreak(list);
  const prevBadges=computeBadges(list,prevStreak,prevLongest);

  const entry={...sel, time};
  const {xp,msgs}=computeBaseXP(entry, currentStreak(list,time)+1);
  entry.xp=xp;
  const newList=[...list,entry];
  saveData(newList);

  let bonus=0, specialMsgs=[], specialTitle=null;
  const newMile=MILESTONES.find(m=>m.n===newList.length);
  if(newMile){
    const mb = newMile.n>=1000?200:(newMile.n>=500?100:50);
    bonus+=mb; specialTitle=`✦ 解锁里程碑：${newMile.title}`;
    specialMsgs.push(`${newMile.desc} 经验大放送 +${mb}！`);
  }
  const newStreak=currentStreak(newList,time);
  const newLongest=longestStreak(newList);
  const newBadges=computeBadges(newList,newStreak,newLongest).filter(id=>!prevBadges.includes(id));
  newBadges.forEach(id=>{
    const b=BADGE_DEFS.find(x=>x.id===id);
    bonus+=20; if(!specialTitle) specialTitle='🏅 解锁新成就';
    specialMsgs.push(`解锁成就「${b.label}」，经验+20！${b.fun}`);
  });
  if(bonus>0){ entry.xp+=bonus; saveData(newList); }

  document.querySelectorAll('#page-record .opt.sel').forEach(o=>o.classList.remove('sel'));
  sel={type:null,color:null,size:null,smell:null,mood:null,duration:null,place:null};
  { const p=nowLocalParts(); document.getElementById('dateInput').value=p.date; document.getElementById('timeOnlyInput').value=p.time; }

  if(specialTitle){
    showToast(specialTitle, [...msgs.map(toneAdjust), ...specialMsgs], true);
  }else{
    const tone=getTone();
    let title = tone==='mild' ? `打卡成功，经验 +${xp}` : tone==='hype' ? `🎉🎉 打卡成功！经验 +${xp} 🔥` : `打卡成功，经验 +${xp}`;
    showToast(maybeName(title,0.5), msgs, false);
  }
  render();
};

function donut(elId,legendId,data){
  const total=data.reduce((s,d)=>s+d.count,0)||1;
  let acc=0, stops=[];
  data.forEach(d=>{ const start=acc/total*360; acc+=d.count; const end=acc/total*360; stops.push(`${d.color} ${start}deg ${end}deg`); });
  document.getElementById(elId).style.background = data.every(d=>d.count===0) ? 'var(--line)' : `conic-gradient(${stops.join(',')})`;
  document.getElementById(legendId).innerHTML = data.map(d=>`<div class="legend-row"><span class="legend-dot" style="background:${d.color}"></span><span>${d.label} · ${d.count}${d.count?` (${Math.round(d.count/total*100)}%)`:''}</span></div>`).join('');
}

function getMilestoneMap(list){
  const asc=[...list].sort((a,b)=>a.time-b.time);
  const map={};
  MILESTONES.forEach(m=>{ if(asc.length>=m.n){ const e=asc[m.n-1]; map[m.n]={...m, achieved:true, date:new Date(e.time)}; } else { map[m.n]={...m, achieved:false}; } });
  return map;
}

let calDate=new Date();
function renderCalendar(list){
  document.getElementById('calTitle').textContent=`${calDate.getFullYear()}年${calDate.getMonth()+1}月`;
  const y=calDate.getFullYear(), m=calDate.getMonth();
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const counts={}, dayEntries={};
  list.forEach(e=>{ const d=new Date(e.time); if(d.getFullYear()===y&&d.getMonth()===m){ counts[d.getDate()]=(counts[d.getDate()]||0)+1; (dayEntries[d.getDate()]=dayEntries[d.getDate()]||[]).push(e); } });
  const mmap=getMilestoneMap(list);
  const mileByDate={};
  Object.values(mmap).forEach(mm=>{ if(mm.achieved && mm.date.getFullYear()===y && mm.date.getMonth()===m){ (mileByDate[mm.date.getDate()]=mileByDate[mm.date.getDate()]||[]).push(mm); } });
  const wdNames=['日','一','二','三','四','五','六'];
  let html=wdNames.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<firstDay;i++) html+='<div></div>';
  const today=new Date();
  for(let d=1; d<=daysInMonth; d++){
    const c=counts[d]||0;
    let cls='cal-day'; if(c===1) cls+=' has1'; else if(c===2) cls+=' has2'; else if(c>=3) cls+=' has3';
    if(y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate()) cls+=' today';
    const star = mileByDate[d] ? '<span class="mstar">✦</span>' : '';
    html+=`<div class="${cls}" data-d="${d}" title="${c}次">${d}${star}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
  document.querySelectorAll('.cal-day[data-d]').forEach(cell=>{
    cell.onclick=()=>{
      const d=parseInt(cell.dataset.d);
      const ents=dayEntries[d]||[];
      const miles=mileByDate[d]||[];
      const dateStr=`${y}年${m+1}月${d}日`;
      let msg='';
      if(miles.length) msg+=miles.map(mm=>`<div style="color:var(--gold2);font-weight:700">✦ 达成里程碑：${mm.title}（第${mm.n}次）<br><span style="font-weight:400;color:var(--sub)">${mm.desc}</span></div>`).join('<br>');
      if(ents.length){ msg+= (msg?'<br><br>':'') + ents.map(e=>{ const t=TYPES.find(t=>t.id===e.type); return `${t?t.ic:''} ${t?t.name:''} · ${e.mood||''} · ${fmtDate(e.time).split(' ')[1]}`; }).join('<br>'); }
      if(!msg) msg='这一天还没有记录。';
      document.getElementById('dayTtl').textContent=dateStr;
      document.getElementById('dayMsg').innerHTML=msg;
      document.getElementById('dayOv').classList.add('show');
    };
  });
}

function render(){
  const list=loadData().sort((a,b)=>b.time-a.time);
  const totalXP=list.reduce((s,e)=>s+(e.xp||0),0);
  const {cur,next,pct}=levelInfo(totalXP);
  document.getElementById('lvName').textContent=`Lv.${cur.lv} ${cur.name}`;
  document.getElementById('lvXP').textContent=`${totalXP} XP`;
  document.getElementById('xpFill').style.width=pct+'%';
  document.getElementById('xpNext').textContent=`还需 ${next.need-totalXP} XP 升级`;

  const hEl=document.getElementById('historyList');
  if(list.length===0){ hEl.innerHTML='<div class="empty">还没有记录，快去打卡吧</div>'; }
  else{
    hEl.innerHTML=list.map((e,i)=>{
      const t=TYPES.find(t=>t.id===e.type);
      return `<div class="entry"><div>
        <div>${t?t.ic:''} ${t?t.name:''} · ${e.color||''} ${e.size||''} · <b style="color:var(--gold2)">+${e.xp||0}XP</b></div>
        <div class="meta">${fmtDate(e.time)} · ${e.mood||''} · ${e.duration||''} · ${e.place||''}</div>
      </div><button class="del" data-idx="${list.length-1-i}">✕</button></div>`;
    }).join('');
    hEl.querySelectorAll('.del').forEach(b=>{ b.onclick=()=>{ const all=loadData(); all.splice(parseInt(b.dataset.idx),1); saveData(all); render(); }; });
  }

  const now=Date.now(), weekAgo=now-7*86400000;
  const recent7=list.filter(e=>e.time>=weekAgo);
  document.getElementById('statWeek').textContent=recent7.length;
  document.getElementById('statTotal').textContent=list.length;
  const streak=currentStreak(list);
  document.getElementById('statStreak').textContent=streak;
  document.getElementById('statLongest').textContent=longestStreak(list);

  donut('typeDonut','typeLegend', TYPES.map(t=>({label:t.ic+' '+t.name,count:list.filter(e=>e.type===t.id).length,color:t.color})));
  const buckets=['清晨','上午','下午','夜晚','深夜'];
  const timeData=buckets.map(b=>({label:b,count:list.filter(e=>timeBucket(new Date(e.time).getHours())===b).length,color:TIME_COLORS[b]}));
  donut('timeDonut','timeLegend',timeData);
  const topBucket=timeData.reduce((a,b)=>b.count>a.count?b:a,timeData[0]);
  const bucketPool=TIME_TITLES[topBucket.label]||[];
  const bucketTitle=bucketPool.length?pick(bucketPool):topBucket.label;
  document.getElementById('timeSummary').innerHTML = list.length ? maybeName(`你最常在 <b>${topBucket.label}</b> 报到，堪称「${bucketTitle}」。`,0.5) : '';

  const maxMood=Math.max(1,...MOODS.map(m=>list.filter(e=>e.mood===m.id).length));
  document.getElementById('moodChips').innerHTML=MOODS.map(m=>{
    const c=list.filter(e=>e.mood===m.id).length;
    const ratio=maxMood?c/maxMood:0;
    const bg=`rgba(122,154,107,${(0.05+ratio*0.32).toFixed(2)})`;
    return `<div class="moodPill" style="background:${bg}"><span>${m.ic}</span><span>${m.id}</span><span class="n">${c}</span></div>`;
  }).join('');

  renderCalendar(list);

  const mmap=getMilestoneMap(list);
  document.getElementById('mileWall').innerHTML=MILESTONES.map(m=>{
    const mm=mmap[m.n];
    if(mm.achieved) return `<div class="wallcard mile"><span class="wic">${m.ic}</span><b>${m.title}</b><br>第${m.n}次</div>`;
    return `<div class="wallcard locked">🔒</div>`;
  }).join('');

  const analysisBox=document.getElementById('analysisBox');
  if(list.length===0){ analysisBox.innerHTML='暂无数据，快去打卡吧～'; }
  else{
    const today=new Date();
    const todays=list.filter(e=>new Date(e.time).toDateString()===today.toDateString());
    const activeDays=new Set(list.map(e=>new Date(e.time).toDateString())).size||1;
    const dailyAvg=(list.length/activeDays).toFixed(1);
    let dayMsg;
    if(todays.length===0) dayMsg=`今天还没有记录，你的日均是 <b>${dailyAvg}</b> 次。`;
    else if(todays.length>dailyAvg*1.5) dayMsg=`今天已记录 <b>${todays.length}</b> 次，高于日均 <b>${dailyAvg}</b> 次，如伴随不适建议关注饮食。`;
    else dayMsg=`今天已记录 <b>${todays.length}</b> 次，日均为 <b>${dailyAvg}</b> 次，状态正常。`;

    let weekMsg;
    const n=recent7.length;
    if(n===0) weekMsg='最近7天<b>还没有记录</b>，记得留意身体信号。';
    else if(n<3) weekMsg=`最近7天只记录了<b>${n}次</b>，频率偏低，注意多喝水、多吃膳食纤维。`;
    else if(n>21) weekMsg=`最近7天记录了<b>${n}次</b>，频率偏高，如伴随不适建议关注饮食。`;
    else weekMsg=`最近7天记录<b>${n}次</b>，频率在健康区间内（每周3~21次）。`;
    const hard=recent7.filter(e=>e.type===1||e.type===2).length;
    const loose=recent7.filter(e=>e.type===6||e.type===7).length;
    const good=recent7.filter(e=>e.type===3||e.type===4).length;
    let typeMsg='';
    if(n>0){
      if(hard/n>0.5) typeMsg='最近<b>偏硬型</b>占比较高，可能轻度便秘，建议增加水分与蔬果摄入。';
      else if(loose/n>0.5) typeMsg='最近<b>偏稀型</b>占比较高，注意饮食卫生，持续请留意身体状况。';
      else if(good/n>=0.5) typeMsg='大部分记录都在<b>理想形态</b>，消化系统状态不错。';
    }
    const painMood=recent7.filter(e=>e.mood==='非常痛苦'||e.mood==='有点费力').length;
    const painMsg = painMood>=3 ? '最近"费力/痛苦"记录较多，注意别太紧张，放松心态更顺畅。' : '';
    const parts=[maybeName(dayMsg,0.3),weekMsg,typeMsg,painMsg].filter(Boolean);
    analysisBox.innerHTML=parts.map(p=>`<div style="margin-bottom:6px">${p}</div>`).join('');
  }

  const badgeEl=document.getElementById('badges');
  const badgeIds=computeBadges(list,streak,longestStreak(list));
  const shown=BADGE_DEFS.filter(b=>badgeIds.includes(b.id)).map(b=>`<span class="badge">${b.ic} ${b.label}</span>`);
  badgeEl.innerHTML = shown.length ? shown.join('') : '<span style="color:var(--sub);font-size:13px">继续打卡解锁成就～</span>';
}
render();
</script>
</body>
</html>
